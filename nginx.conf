# Serves the PWA and reverse-proxies the API so everything is same-origin.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # The API's address is looked up again every few seconds instead of once at start-up. A redeploy gives the API
  # container a new address; without this nginx keeps sending requests to the old one (502 until web is restarted).
  # NGINX_LOCAL_RESOLVERS is the container's own DNS server (from /etc/resolv.conf, see the Dockerfile).
  resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;

  # API, health check and the live event stream
  location ~ ^/(api|healthz) {
    set $api_upstream ${API_URL};   # a variable makes nginx resolve the name per request, through the resolver
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;
    proxy_buffering off;            # server-sent events (/api/events/stream/) must not be buffered
    proxy_read_timeout 90s;
  }

  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
